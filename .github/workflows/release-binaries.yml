name: Release Binaries

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write  # Required for creating releases

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-

    - name: Build x86_64 Linux (static musl)
      run: |
        nix develop -c cargo build --release
        mkdir -p artifacts/linux-x86_64
        cp target/x86_64-unknown-linux-musl/release/youtube-archiver artifacts/linux-x86_64/youtube-archiver
        chmod +x artifacts/linux-x86_64/youtube-archiver

    - name: Create checksums
      run: |
        cd artifacts
        for dir in */; do
          (cd "$dir" && sha256sum youtube-archiver > youtube-archiver.sha256)
        done

    - name: Create tarball archives
      run: |
        cd artifacts
        for dir in */; do
          dirname="${dir%/}"
          tar czf "youtube-archiver-${dirname}.tar.gz" "$dirname"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: youtube-archiver-linux-binaries
        path: artifacts/*.tar.gz
        retention-days: 90

  build-macos:
    name: Build macOS Binaries
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-apple-darwin,aarch64-apple-darwin

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-

    - name: Build x86_64 macOS
      run: |
        cargo build --release --target x86_64-apple-darwin
        mkdir -p artifacts/macos-x86_64
        cp target/x86_64-apple-darwin/release/youtube-archiver artifacts/macos-x86_64/youtube-archiver
        chmod +x artifacts/macos-x86_64/youtube-archiver

    - name: Build ARM64 macOS (Apple Silicon)
      run: |
        cargo build --release --target aarch64-apple-darwin
        mkdir -p artifacts/macos-aarch64
        cp target/aarch64-apple-darwin/release/youtube-archiver artifacts/macos-aarch64/youtube-archiver
        chmod +x artifacts/macos-aarch64/youtube-archiver

    - name: Create checksums
      run: |
        cd artifacts
        for dir in */; do
          (cd "$dir" && shasum -a 256 youtube-archiver > youtube-archiver.sha256)
        done

    - name: Create tarball archives
      run: |
        cd artifacts
        for dir in */; do
          dirname="${dir%/}"
          tar czf "youtube-archiver-${dirname}.tar.gz" "$dirname"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: youtube-archiver-macos-binaries
        path: artifacts/*.tar.gz
        retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: release-artifacts

    - name: Get short SHA
      id: sha
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Prepare release files
      run: |
        mkdir -p release-files
        mv release-artifacts/youtube-archiver-linux-binaries/* release-files/
        mv release-artifacts/youtube-archiver-macos-binaries/* release-files/

        # Bootstrap script for one-command install / auto-update.
        cp youtube-archiver.sh release-files/
        chmod +x release-files/youtube-archiver.sh

        ls -la release-files/

    - name: Create release notes
      run: |
        cat > release-notes.md << EOF
        ## youtube-archiver Latest Build (master branch)

        **Build Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')
        **Commit:** ${{ steps.sha.outputs.sha_short }}

        ### Available Binaries

        #### Linux
        - \`youtube-archiver-linux-x86_64.tar.gz\` — Fully static musl binary (works on every Linux distro, no glibc dependency)

        #### macOS
        - \`youtube-archiver-macos-x86_64.tar.gz\` — Intel Mac
        - \`youtube-archiver-macos-aarch64.tar.gz\` — Apple Silicon (M1/M2/M3)

        ### Runtime Requirements

        \`youtube-archiver\` shells out to two external tools at runtime — you need them on PATH:

        - **yt-dlp** — download and metadata extraction
        - **whisper** (openai-whisper) — transcription. The default \`--whisper-bin\` invokes \`nix run nixpkgs#openai-whisper --\`; override with \`--whisper-bin whisper\` if you have it installed natively.

        On NixOS you can get both from a dev shell of this repo: \`nix develop\`.

        ### Installation

        #### Quick install (bootstrap script)

        Drop in the \`youtube-archiver.sh\` wrapper — it detects your platform, downloads the right binary into \`~/.local/bin\`, and self-updates daily:

        \`\`\`bash
        curl -L https://github.com/${{ github.repository }}/releases/download/latest-master/youtube-archiver.sh -o youtube-archiver
        chmod +x youtube-archiver
        ./youtube-archiver --help
        \`\`\`

        When run from a checked-out repo with a local build under \`target/release\` (or \`target/x86_64-unknown-linux-musl/release\`), the wrapper execs the local binary instead of downloading.

        #### Manual install

        1. Download the appropriate archive for your platform.
        2. Extract it.
        3. \`chmod +x youtube-archiver && sudo mv youtube-archiver /usr/local/bin/\`

        ### Verify Checksums

        Each archive contains a \`.sha256\` file with the binary's checksum.

        \`\`\`bash
        sha256sum -c youtube-archiver.sha256
        \`\`\`

        ---
        *Automated build from \`master\`. For stable releases, see the Releases page.*
        EOF

    - name: Delete existing latest release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest-master --yes 2>/dev/null || true
        git push --delete origin latest-master 2>/dev/null || true

    - name: Create new release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create latest-master \
          --title "Latest Build (master)" \
          --notes-file release-notes.md \
          --prerelease \
          release-files/*
