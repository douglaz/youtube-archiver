[package]
name = "youtube-archiver"
version = "0.1.0"
edition = "2024"
description = "Archive YouTube audio, transcribe with Whisper, emit llm-wiki-ingestible markdown"
license = "MIT"
repository = "https://github.com/douglaz/youtube-archiver"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
fs4 = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
